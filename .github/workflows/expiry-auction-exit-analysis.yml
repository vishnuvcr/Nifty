name: Expiry Auction Exit Analysis — NIFTY + SENSEX

on:
  push:
    branches:
      - research/expiry-auction-exit-analysis-v1
    paths:
      - scripts/expiry_auction_exit_analysis_v1.py
      - docs/expiry_exit_analysis/**
      - .github/workflows/expiry-auction-exit-analysis.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expiry-auction-exit-analysis
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: research/expiry-auction-exit-analysis-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow huggingface_hub

      - name: Restore cached source dataset
        uses: actions/cache@v4
        with:
          path: data/hf_index_options
          key: india-index-options-1m-expiry-exit-v1
          restore-keys: |
            india-index-options-1m-expiry-exit-

      - name: Download source data on cache miss
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/hf_index_options/index/NIFTY.parquet || ! -f data/hf_index_options/index/SENSEX.parquet ]]; then
            rm -rf data/hf_index_options
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m", repo_type="dataset", local_dir="data/hf_index_options", allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet","index/SENSEX.parquet","options/SENSEX/*.parquet"])'
          fi
          test -f data/hf_index_options/index/NIFTY.parquet
          test -f data/hf_index_options/index/SENSEX.parquet

      - name: Prepare stable analysis paths
        run: |
          set -euo pipefail
          rm -rf data/expiry_exit
          mkdir -p data/expiry_exit/options_NIFTY data/expiry_exit/options_SENSEX
          cp data/hf_index_options/index/NIFTY.parquet data/expiry_exit/index_NIFTY.parquet
          cp data/hf_index_options/index/SENSEX.parquet data/expiry_exit/index_SENSEX.parquet
          cp data/hf_index_options/options/NIFTY/*.parquet data/expiry_exit/options_NIFTY/
          cp data/hf_index_options/options/SENSEX/*.parquet data/expiry_exit/options_SENSEX/

      - name: Compile engine
        run: python -m py_compile scripts/expiry_auction_exit_analysis_v1.py

      - name: Run complete exit-scenario analysis
        run: |
          python scripts/expiry_auction_exit_analysis_v1.py --paths 5000 --seed-base 20260920 --out-dir reports/expiry_exit

      - name: Publish results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin research/expiry-auction-exit-analysis-v1
          git reset --hard origin/research/expiry-auction-exit-analysis-v1
          git add reports/expiry_exit
          git commit -m "research: publish expiry-day exit analysis [skip ci]" || true
          git push origin HEAD:research/expiry-auction-exit-analysis-v1

      - name: Summary
        run: |
          echo "Expiry-day exit analysis completed. Results are under reports/expiry_exit."
          cat reports/expiry_exit/MASTER_SUMMARY.csv || true
