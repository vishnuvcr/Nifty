name: NIFTY Defined-Risk Prospective Validation
on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      strategy:
        description: "Candidate to scan"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - Jade Lizard
          - Put Ratio Spread
          - Put Ratio Spread
concurrency:
  group: nifty-defined-risk-prospective
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-defined-risk-nifty-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Scan frozen candidates
        env:
          STRATEGY: ${{ github.event.inputs.strategy || 'all' }}
        run: python scripts/nifty_defined_risk_prospective_v1.py --mode scan --strategy "$STRATEGY"
      - name: Persist candidate state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/prospective_defined_risk/nifty site/prospective-defined-risk/nifty
          if git diff --cached --quiet; then echo "No state changes."; else git commit -m "paper: update NIFTY defined-risk prospective candidates [skip ci]"; git push origin HEAD:research/prospective-defined-risk-nifty-v1; fi
