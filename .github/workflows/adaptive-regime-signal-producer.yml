name: Adaptive Regime Signal Producer

on:
  push:
    branches: ["research/monte-carlo-wfa-v1"]
    paths:
      - scripts/adaptive_regime_signal_producer.py
      - tests/test_adaptive_regime_signal_producer.py
      - .github/workflows/adaptive-regime-signal-producer.yml
  pull_request:
    branches: ["main"]
    paths:
      - scripts/adaptive_regime_signal_producer.py
      - tests/test_adaptive_regime_signal_producer.py
      - .github/workflows/adaptive-regime-signal-producer.yml
  workflow_dispatch:
    inputs:
      capital:
        description: "Paper capital in INR"
        required: true
        default: "100000"
      risk_pct:
        description: "Risk budget fraction per trade"
        required: true
        default: "0.02"
      lot_size:
        description: "NIFTY lot size"
        required: true
        default: "65"
      paths:
        description: "Monte Carlo paths"
        required: true
        default: "5000"
      cost_per_contract:
        description: "Stress execution cost per contract in option points"
        required: true
        default: "2.0"
      expiry:
        description: "Optional explicit expiry YYYY-MM-DD"
        required: false
        default: ""
  schedule:
    - cron: "0 4 * * 1-5"

concurrency:
  group: adaptive-regime-signal-producer
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  CAPITAL: ${{ github.event.inputs.capital || '100000' }}
  RISK_PCT: ${{ github.event.inputs.risk_pct || '0.02' }}
  LOT_SIZE: ${{ github.event.inputs.lot_size || '65' }}
  PATHS: ${{ github.event.inputs.paths || '5000' }}
  COST_PER_CONTRACT: ${{ github.event.inputs.cost_per_contract || '2.0' }}
  EXPIRY: ${{ github.event.inputs.expiry || '' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  V2_RUN_ID: "35425922439"

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Unit tests
        run: |
          pytest -q tests/test_adaptive_regime_signal_producer.py

      - name: Download run 9 historical feature seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download "$V2_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name strategy-regime-lab-v2-results \
            --dir input
          test -f input/nifty_regime_predictions.csv

      - name: Produce prospective signal
        run: |
          CMD=(python scripts/adaptive_regime_signal_producer.py
            --capital "$CAPITAL"
            --risk-pct "$RISK_PCT"
            --lot-size "$LOT_SIZE"
            --paths "$PATHS"
            --cost-per-contract "$COST_PER_CONTRACT"
            --decision-date auto
            --history-seed input/nifty_regime_predictions.csv)
          if [ -n "$EXPIRY" ]; then
            CMD+=(--expiry "$EXPIRY")
          fi
          "${CMD[@]}"

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-regime-signal-run-${{ github.run_id }}
          path: |
            site/adaptive/
            paper_trading/adaptive_regime_signals.csv
            paper_trading/adaptive_regime_ledger.csv
            paper_trading/adaptive_feature_history.csv
          retention-days: 30

      - name: Persist prospective paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/adaptive_regime_signals.csv \
                  paper_trading/adaptive_regime_ledger.csv \
                  paper_trading/adaptive_feature_history.csv
          if git diff --cached --quiet; then
            echo "No prospective paper-trading state changes."
          else
            git commit -m "chore: update adaptive regime paper state [skip ci]"
            git push
          fi

      - name: Publish summary
        run: |
          echo "## Adaptive Regime Signal Producer" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Strategy identities are frozen: High vol → Short Strangle; Medium vol → Sell Put; Low vol → NO_TRADE." >> "$GITHUB_STEP_SUMMARY"
          echo "Prospective entry protocol: exact 3 trading sessions before expiry, entry snapshot at 09:30 IST, model cutoff at prior completed session." >> "$GITHUB_STEP_SUMMARY"
