name: Refresh NIFTY Paper Trading Dashboards
# v1: centrally publishes isolated Batman and Adaptive dashboards from the research branch.

on:
  schedule:
    # 16:00 IST = 10:30 UTC (India has no daylight-saving change)
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      capital:
        description: "Paper capital in INR"
        required: true
        default: "100000"
      risk_pct:
        description: "Risk budget fraction per trade"
        required: true
        default: "0.02"
      lot_size:
        description: "NIFTY lot size"
        required: true
        default: "65"
      paths:
        description: "Monte Carlo paths"
        required: true
        default: "5000"
      cost_per_contract:
        description: "Stress cost per option contract, in points"
        required: true
        default: "2.0"
      expiry:
        description: "Optional explicit expiry YYYY-MM-DD"
        required: false
        default: ""
      seed:
        description: "Optional fixed Monte Carlo seed for reproducibility"
        required: false
        default: ""

concurrency:
  group: nifty-paper-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPITAL: ${{ github.event.inputs.capital || '100000' }}
      RISK_PCT: ${{ github.event.inputs.risk_pct || '0.02' }}
      LOT_SIZE: ${{ github.event.inputs.lot_size || '65' }}
      PATHS: ${{ github.event.inputs.paths || '5000' }}
      COST_PER_CONTRACT: ${{ github.event.inputs.cost_per_contract || '2.0' }}
      EXPIRY: ${{ github.event.inputs.expiry || '' }}
      SEED: ${{ github.event.inputs.seed || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout paper-trading branch
        uses: actions/checkout@v4
        with:
          ref: research/adaptive-paper-signals-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Refresh ledgers and dashboards only
        run: |
          python scripts/refresh_paper_pages_v1.py --capital "$CAPITAL" --refresh-cutoff auto

      - name: Persist refresh state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/batman_ledger.csv                   paper_trading/adaptive_ledger.csv                   site
          if git diff --cached --quiet; then
            echo "No refresh state changes."
          else
            git commit -m "chore: refresh paper trading dashboards [skip ci]"
            git push origin HEAD:research/adaptive-paper-signals-v1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Publish summary
        run: |
          {
            echo "## NIFTY paper-trading dashboard refresh"
            echo
            echo "- Refresh schedule: weekdays at 16:00 IST (10:30 UTC)"
            echo "- Branch: research/adaptive-paper-signals-v1"
            echo "- Pages: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "- Batman dashboard: /batman/"
            echo "- Adaptive dashboard: /adaptive/"
            echo
            echo "Refresh-only: no new entry signal is generated at 16:00 IST. Both systems are paper-only; no broker orders are placed."
          } >> "$GITHUB_STEP_SUMMARY"
