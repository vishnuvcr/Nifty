name: Refresh NIFTY Paper Trading Dashboards
# v3.3: final audit/backfill page hardening. Common Paper Trade Signals Producer waits for all entry workflows before one publication; 16:00 IST remains refresh-only.

on:
  push:
    paths:
      - ".github/workflows/publish-paper-pages.yml"
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      capital:
        description: "Paper capital in INR"
        required: true
        default: "100000"
      risk_pct:
        description: "Risk budget fraction per trade"
        required: true
        default: "0.02"
      lot_size:
        description: "NIFTY lot size"
        required: true
        default: "65"
      paths:
        description: "Monte Carlo paths"
        required: true
        default: "5000"
      cost_per_contract:
        description: "Stress cost per option contract, in points"
        required: true
        default: "2.0"
      expiry:
        description: "Optional explicit NIFTY expiry YYYY-MM-DD"
        required: false
        default: ""
      seed:
        description: "Optional fixed Monte Carlo seed for reproducibility"
        required: false
        default: ""

concurrency:
  group: index-paper-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPITAL: ${{ github.event.inputs.capital || '100000' }}
      RISK_PCT: ${{ github.event.inputs.risk_pct || '0.02' }}
      LOT_SIZE: ${{ github.event.inputs.lot_size || '65' }}
      PATHS: ${{ github.event.inputs.paths || '5000' }}
      COST_PER_CONTRACT: ${{ github.event.inputs.cost_per_contract || '2.0' }}
      EXPIRY: ${{ github.event.inputs.expiry || '' }}
      SEED: ${{ github.event.inputs.seed || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout NIFTY paper-trading branch
        uses: actions/checkout@v4
        with:
          ref: research/adaptive-paper-signals-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Refresh NIFTY ledgers and dashboards only
        run: |
          python scripts/refresh_paper_pages_v1.py --capital "$CAPITAL" --refresh-cutoff auto

      - name: Sync SENSEX S7 dashboard state
        run: |
          git fetch origin research/sensex-s7-paper-trading-v1
          rm -rf site/sensex
          git archive origin/research/sensex-s7-paper-trading-v1 site/sensex | tar -x
          test -f site/sensex/index.html
          test -f site/sensex/batman/index.html
          test -f site/sensex/adaptive/index.html
          echo "SENSEX dashboard state synchronized from research/sensex-s7-paper-trading-v1"

      - name: Sync frozen defined-risk prospective dashboards
        run: |
          git fetch origin research/prospective-defined-risk-nifty-v1
          git fetch origin research/prospective-defined-risk-sensex-v1
          rm -rf site/prospective-defined-risk
          rm -rf site/sensex/prospective-defined-risk
          git archive origin/research/prospective-defined-risk-nifty-v1 site/prospective-defined-risk | tar -x
          git archive origin/research/prospective-defined-risk-sensex-v1 site/sensex/prospective-defined-risk | tar -x
          test -f site/prospective-defined-risk/nifty/index.html
          test -f site/sensex/prospective-defined-risk/index.html
          echo "Defined-risk prospective dashboards synchronized."
      - name: Sync workflow run audit records
        run: |
          git fetch origin research/adaptive-paper-signals-v1
          git fetch origin research/monte-carlo-wfa-v1
          git fetch origin research/sensex-s7-paper-trading-v1
          git fetch origin research/prospective-defined-risk-nifty-v1
          git fetch origin research/prospective-defined-risk-sensex-v1
          mkdir -p site/data

          copy_status() {
            local ref="$1"
            local src="$2"
            local dst="$3"
            if git cat-file -e "origin/$ref:$src" 2>/dev/null; then
              git show "origin/$ref:$src" > "$dst"
            else
              cat > "$dst" <<EOF
          {"workflow":"$dst","status":"NOT_RECORDED","finished_at_ist":null,"note":"Run audit instrumentation was added after the historical run; no prior workflow timestamp was persisted."}
          EOF
            fi
          }

          copy_status "research/monte-carlo-wfa-v1" "site/data/run_status_batman.json" "site/data/run_status_batman.json"
          copy_status "research/adaptive-paper-signals-v1" "site/data/run_status_nifty_signal_generation.json" "site/data/run_status_nifty_signal_generation.json"
          copy_status "research/adaptive-paper-signals-v1" "site/data/run_status_nifty_adaptive.json" "site/data/run_status_nifty_adaptive.json"
          copy_status "research/sensex-s7-paper-trading-v1" "site/data/run_status_sensex.json" "site/data/run_status_sensex.json"
          copy_status "research/prospective-defined-risk-nifty-v1" "site/data/run_status_defined_risk_nifty.json" "site/data/run_status_defined_risk_nifty.json"
          copy_status "research/prospective-defined-risk-sensex-v1" "site/data/run_status_defined_risk_sensex.json" "site/data/run_status_defined_risk_sensex.json"

      - name: Build combined run-status feed and validate Pages tree
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          base = Path("site/data")
          def read(name):
              p = base / name
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  return {"workflow": name, "status": "READ_ERROR", "finished_at_ist": None, "note": str(exc)}

          src = {
              "batman": read("run_status_batman.json"),
              "nifty_generation": read("run_status_nifty_signal_generation.json"),
              "nifty_adaptive": read("run_status_nifty_adaptive.json"),
              "sensex": read("run_status_sensex.json"),
              "defined_risk_nifty": read("run_status_defined_risk_nifty.json"),
              "defined_risk_sensex": read("run_status_defined_risk_sensex.json"),
          }

          def ts(x):
              v = x.get("finished_at_ist")
              if not v:
                  return datetime.min
              try:
                  return datetime.fromisoformat(v.replace("Z","+00:00")).replace(tzinfo=None)
              except Exception:
                  return datetime.min

          def latest(*names):
              vals = [src[n] for n in names]
              return max(vals, key=ts)

          combined = {
              "generated_at_ist": datetime.now(ZoneInfo("Asia/Kolkata")).isoformat(),
              "nifty_batman": latest("batman", "nifty_generation"),
              "nifty_adaptive": latest("nifty_generation", "nifty_adaptive"),
              "sensex_batman": src["sensex"],
              "sensex_adaptive": src["sensex"],
              "nifty_defined_risk": src["defined_risk_nifty"],
              "sensex_defined_risk": src["defined_risk_sensex"],
          }
          (base / "run_status.json").write_text(json.dumps(combined, indent=2) + "\n", encoding="utf-8")
          (base / "pages_manifest.json").write_text(json.dumps({
              "required_paths": [
                  "index.html",
                  "batman/index.html",
                  "adaptive/index.html",
                  "sensex/index.html",
                  "sensex/batman/index.html",
                  "sensex/adaptive/index.html",
                  "prospective-defined-risk/nifty/index.html",
                  "prospective-defined-risk/nifty/jade-lizard/index.html",
                  "prospective-defined-risk/nifty/put-ratio-spread/index.html",
                  "sensex/prospective-defined-risk/index.html",
                  "sensex/prospective-defined-risk/jade-lizard/index.html",
                  "sensex/prospective-defined-risk/put-ratio-spread/index.html"
              ]
          }, indent=2) + "\n", encoding="utf-8")
          PY

          required=(
            site/index.html
            site/batman/index.html
            site/adaptive/index.html
            site/sensex/index.html
            site/sensex/batman/index.html
            site/sensex/adaptive/index.html
            site/prospective-defined-risk/nifty/index.html
            site/prospective-defined-risk/nifty/jade-lizard/index.html
            site/prospective-defined-risk/nifty/put-ratio-spread/index.html
            site/sensex/prospective-defined-risk/index.html
            site/sensex/prospective-defined-risk/jade-lizard/index.html
            site/sensex/prospective-defined-risk/put-ratio-spread/index.html
            site/data/run_status.json
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "MISSING REQUIRED PAGE: $f"; exit 1; }
          done

          grep -q "BATMAN" site/index.html
          grep -q "ADAPTIVE STRATEGY" site/index.html
          grep -q "BSE SENSEX" site/index.html
          grep -q "JADE LIZARD" site/index.html
          grep -q "PUT RATIO SPREAD" site/index.html

      - name: Persist combined dashboard state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin research/adaptive-paper-signals-v1
          git pull --rebase --autostash origin research/adaptive-paper-signals-v1
          git add paper_trading/batman_ledger.csv paper_trading/adaptive_ledger.csv site
          if git diff --cached --quiet; then
            echo "No dashboard state changes."
          else
            git commit -m "chore: refresh index paper trading dashboards [skip ci]"
            git push origin HEAD:research/adaptive-paper-signals-v1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Publish summary
        run: |
          {
            echo "## Index options paper-trading dashboard refresh"
            echo
            echo "- Refresh schedule: weekdays at 16:00 IST (10:30 UTC)"
            echo "- Root: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "- NIFTY: /"
            echo "- NIFTY Batman: /batman/"
            echo "- NIFTY Adaptive: /adaptive/"
            echo "- SENSEX: /sensex/"
            echo "- SENSEX Batman: /sensex/batman/"
            echo "- SENSEX Adaptive: /sensex/adaptive/"
            echo "- NIFTY defined-risk prospective: /prospective-defined-risk/nifty/"
            echo "- NIFTY Jade Lizard: /prospective-defined-risk/nifty/jade-lizard/"
            echo "- NIFTY Put Ratio Spread: /prospective-defined-risk/nifty/put-ratio-spread/"
            echo "- SENSEX defined-risk prospective: /sensex/prospective-defined-risk/"
            echo "- SENSEX Jade Lizard: /sensex/prospective-defined-risk/jade-lizard/"
            echo "- SENSEX Put Ratio Spread: /sensex/prospective-defined-risk/put-ratio-spread/"
            echo "- Run audit feed: /data/run_status.json"
            echo "- Pages tree validation: all required strategy dashboards must exist before deploy"
            echo
            echo "The 16:00 job settles matured paper trades and republishes both indices. It does not create a second entry signal."
          } >> "$GITHUB_STEP_SUMMARY"
