name: Refresh NIFTY Paper Trading Dashboards
# v3: centrally publishes NIFTY, SENSEX and defined-risk prospective paper-trading dashboards. 16:00 IST is refresh-only.

on:
  push:
    paths:
      - ".github/workflows/publish-paper-pages.yml"
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      capital:
        description: "Paper capital in INR"
        required: true
        default: "100000"
      risk_pct:
        description: "Risk budget fraction per trade"
        required: true
        default: "0.02"
      lot_size:
        description: "NIFTY lot size"
        required: true
        default: "65"
      paths:
        description: "Monte Carlo paths"
        required: true
        default: "5000"
      cost_per_contract:
        description: "Stress cost per option contract, in points"
        required: true
        default: "2.0"
      expiry:
        description: "Optional explicit NIFTY expiry YYYY-MM-DD"
        required: false
        default: ""
      seed:
        description: "Optional fixed Monte Carlo seed for reproducibility"
        required: false
        default: ""

concurrency:
  group: index-paper-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPITAL: ${{ github.event.inputs.capital || '100000' }}
      RISK_PCT: ${{ github.event.inputs.risk_pct || '0.02' }}
      LOT_SIZE: ${{ github.event.inputs.lot_size || '65' }}
      PATHS: ${{ github.event.inputs.paths || '5000' }}
      COST_PER_CONTRACT: ${{ github.event.inputs.cost_per_contract || '2.0' }}
      EXPIRY: ${{ github.event.inputs.expiry || '' }}
      SEED: ${{ github.event.inputs.seed || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout NIFTY paper-trading branch
        uses: actions/checkout@v4
        with:
          ref: research/adaptive-paper-signals-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Refresh NIFTY ledgers and dashboards only
        run: |
          python scripts/refresh_paper_pages_v1.py --capital "$CAPITAL" --refresh-cutoff auto

      - name: Sync SENSEX S7 dashboard state
        run: |
          git fetch origin research/sensex-s7-paper-trading-v1
          rm -rf site/sensex
          git archive origin/research/sensex-s7-paper-trading-v1 site/sensex | tar -x
          test -f site/sensex/index.html
          test -f site/sensex/batman/index.html
          test -f site/sensex/adaptive/index.html
          echo "SENSEX dashboard state synchronized from research/sensex-s7-paper-trading-v1"

      - name: Sync frozen defined-risk prospective dashboards
        run: |
          git fetch origin research/prospective-defined-risk-nifty-v1
          git fetch origin research/prospective-defined-risk-sensex-v1
          rm -rf site/prospective-defined-risk
          rm -rf site/sensex/prospective-defined-risk
          git archive origin/research/prospective-defined-risk-nifty-v1 site/prospective-defined-risk | tar -x
          git archive origin/research/prospective-defined-risk-sensex-v1 site/sensex/prospective-defined-risk | tar -x
          test -f site/prospective-defined-risk/nifty/index.html
          test -f site/sensex/prospective-defined-risk/index.html
          echo "Defined-risk prospective dashboards synchronized."
      - name: Persist combined dashboard state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin research/adaptive-paper-signals-v1
          git pull --rebase --autostash origin research/adaptive-paper-signals-v1
          git add paper_trading/batman_ledger.csv paper_trading/adaptive_ledger.csv site
          if git diff --cached --quiet; then
            echo "No dashboard state changes."
          else
            git commit -m "chore: refresh index paper trading dashboards [skip ci]"
            git push origin HEAD:research/adaptive-paper-signals-v1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Publish summary
        run: |
          {
            echo "## Index options paper-trading dashboard refresh"
            echo
            echo "- Refresh schedule: weekdays at 16:00 IST (10:30 UTC)"
            echo "- Root: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "- NIFTY: /"
            echo "- NIFTY Batman: /batman/"
            echo "- NIFTY Adaptive: /adaptive/"
            echo "- SENSEX: /sensex/"
            echo "- SENSEX Batman: /sensex/batman/"
            echo "- SENSEX Adaptive: /sensex/adaptive/"
            echo "- NIFTY defined-risk prospective: /prospective-defined-risk/nifty/"
            echo "- NIFTY Jade Lizard: /prospective-defined-risk/nifty/jade-lizard/"
            echo "- NIFTY Put Ratio Spread: /prospective-defined-risk/nifty/put-ratio-spread/"
            echo "- SENSEX defined-risk prospective: /sensex/prospective-defined-risk/"
            echo "- SENSEX Jade Lizard: /sensex/prospective-defined-risk/jade-lizard/"
            echo "- SENSEX Put Ratio Spread: /sensex/prospective-defined-risk/put-ratio-spread/"
            echo
            echo "The 16:00 job settles matured paper trades and republishes both indices. It does not create a second entry signal."
          } >> "$GITHUB_STEP_SUMMARY"
