name: SENSEX S5 Walk-Forward Dispatcher

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      slippage:
        description: "Adverse slippage points per executed option leg"
        required: true
        default: "0.5"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout SENSEX S5
        uses: actions/checkout@v4
        with:
          ref: research/sensex-s5-wfa-backtest-v1
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record run start
        run: |
          mkdir -p reports/sensex_options
          date -u +"%Y-%m-%dT%H:%M:%SZ" > reports/sensex_options/RUN_STARTED_UTC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sensex_options/RUN_STARTED_UTC.txt
          git commit -m "ci: mark SENSEX S5 backtest started [skip ci]"
          git push origin HEAD:research/sensex-s5-wfa-backtest-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pandas numpy pyarrow
          python -m pip install -e .
      - name: Cache pre-2024 SENSEX warmup history
        uses: actions/cache@v4
        with:
          path: data/external/sensex_legacy_2018_2024.csv
          key: sensex-warmup-2018-2024-v1

      - name: Fetch pre-2024 SENSEX warmup history
        run: |
          if [ -f data/external/sensex_legacy_2018_2024.csv ]; then
            echo "Using cached warmup history."
          else
            mkdir -p data/external
            curl -L --retry 5 --retry-delay 2 -A "Mozilla/5.0" -o data/external/sensex_legacy_2018_2024.csv https://raw.githubusercontent.com/sandeepkapri/Sensex-Minute-Data/master/sensex_candlestick_data.csv
          fi
          test -s data/external/sensex_legacy_2018_2024.csv

      - name: Cache SENSEX dataset
        uses: actions/cache@v4
        with:
          path: data/raw_sensex
          key: sensex-options-${{ runner.os }}-2026-09-v4

      - name: Fetch SENSEX 1-minute dataset
        run: |
          if [ -f data/raw_sensex/index/SENSEX.parquet ]; then
            echo "Using cached SENSEX dataset."
            exit 0
          fi
          python -m pip install huggingface_hub
          mkdir -p data/raw_sensex
          hf download thetrademarkk/india-index-options-1m index/SENSEX.parquet --repo-type dataset --local-dir data/raw_sensex
          for year in 2024 2025; do
            hf download thetrademarkk/india-index-options-1m --include "options/SENSEX/$year-*.parquet" --repo-type dataset --local-dir data/raw_sensex
          done
          for month in 01 02 03 04 05 06 07; do
            hf download thetrademarkk/india-index-options-1m --include "options/SENSEX/2026-$month-*.parquet" --repo-type dataset --local-dir data/raw_sensex
          done
          test -f data/raw_sensex/index/SENSEX.parquet
          test -d data/raw_sensex/options/SENSEX
      - name: Build independent daily SENSEX MC history
        run: |
          python - <<'PY'
          import pandas as pd
          legacy = pd.read_csv('data/external/sensex_legacy_2018_2024.csv')
          legacy['timestamp'] = pd.to_datetime(legacy['Date'].astype(str)+' '+legacy['Time'].astype(str), dayfirst=True, errors='coerce')
          legacy['close'] = pd.to_numeric(legacy['Close'], errors='coerce')
          legacy = legacy.dropna(subset=['timestamp','close']).sort_values('timestamp')
          legacy['trading_day'] = legacy['timestamp'].dt.normalize()
          legacy_daily = legacy.groupby('trading_day', as_index=False).tail(1)[['timestamp','trading_day','close']]
          hf = pd.read_parquet('data/raw_sensex/index/SENSEX.parquet')
          hf['timestamp'] = pd.to_datetime(hf['timestamp'], errors='coerce')
          if getattr(hf['timestamp'].dt, 'tz', None) is not None:
              hf['timestamp'] = hf['timestamp'].dt.tz_localize(None)
          hf['trading_day'] = pd.to_datetime(hf['trading_day'], errors='coerce').dt.normalize()
          hf['close'] = pd.to_numeric(hf['close'], errors='coerce')
          hf = hf.dropna(subset=['timestamp','trading_day','close']).sort_values('timestamp')
          hf_daily = hf.groupby('trading_day', as_index=False).tail(1)[['timestamp','trading_day','close']]
          daily = pd.concat([legacy_daily, hf_daily], ignore_index=True).sort_values(['trading_day','timestamp'])
          daily = daily.drop_duplicates('trading_day', keep='last').reset_index(drop=True)
          daily['open'] = daily['close']; daily['high'] = daily['close']; daily['low'] = daily['close']
          daily.to_parquet('data/external/sensex_mc_daily.parquet', index=False)
          print('MC daily rows:', len(daily), 'from', daily.trading_day.min(), 'to', daily.trading_day.max())
          PY

      - name: Backtest development
        run: python scripts/sensex_backtest_v1.py --options-dir data/raw_sensex/options/SENSEX --index-path data/raw_sensex/index/SENSEX.parquet --split development --slippage "${{ inputs.slippage || '0.5' }}" --out-dir reports/sensex_options
      - name: Backtest validation
        run: python scripts/sensex_backtest_v1.py --options-dir data/raw_sensex/options/SENSEX --index-path data/raw_sensex/index/SENSEX.parquet --split validation --slippage "${{ inputs.slippage || '0.5' }}" --out-dir reports/sensex_options
      - name: Backtest holdout
        run: python scripts/sensex_backtest_v1.py --options-dir data/raw_sensex/options/SENSEX --index-path data/raw_sensex/index/SENSEX.parquet --split holdout --slippage "${{ inputs.slippage || '0.5' }}" --out-dir reports/sensex_options
      - name: Publish reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sensex_options
          git commit -m "research: publish SENSEX S5 backtest results [skip ci]" || true
          git push origin HEAD:research/sensex-s5-wfa-backtest-v1