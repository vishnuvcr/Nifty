name: Batman First Trade Backfill
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/batman-first-trade-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  backfill:
    if: ${{ !contains(github.event.head_commit.message || '', '[backfill-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/monte-carlo-wfa-v1
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run first-trade backfill
        run: python scripts/backfill_batman_first_trade.py
      - name: Persist backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/batman_ledger.csv paper_trading/batman_signals.csv site
          git commit -m "feat: add Batman first paper trade backfill" || echo "No changes to commit"
          git push origin HEAD:research/monte-carlo-wfa-v1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Remove one-off backfill workflow
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/batman-first-trade-backfill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/batman-first-trade-backfill.yml
          git commit -m "chore: remove one-off Batman backfill workflow [backfill-cleanup]" || echo "Already removed"
          git push origin main
