name: Batman First Trade Backfill
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/batman-first-trade-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  backfill:
    if: ${{ !contains(github.event.head_commit.message || '', '[backfill-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/monte-carlo-wfa-v1
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run first-trade backfill
        id: backfill
        continue-on-error: true
        run: |
          set +e
          python scripts/backfill_batman_first_trade.py > /tmp/backfill.log 2>&1
          rc=$?
          cat /tmp/backfill.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic
        if: always()
        run: |
          status_file=/tmp/batman_backfill_status.txt
          {
            echo "run_id=${{ github.run_id }}"
            echo "backfill_rc=${{ steps.backfill.outputs.rc }}"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo "----- LOG -----"
            cat /tmp/backfill.log 2>/dev/null || true
          } > "$status_file"
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          cp "$status_file" batman_backfill_status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batman_backfill_status.txt
          git commit -m "chore: publish Batman backfill diagnostic" || true
          git push origin main
      - name: Stop after diagnostic on failure
        if: steps.backfill.outputs.rc != '0'
        run: |
          echo "Batman backfill failed; diagnostic published in batman_backfill_status.txt."
          exit 1
      - name: Checkout research branch for persistence
        uses: actions/checkout@v4
        with:
          ref: research/monte-carlo-wfa-v1
          fetch-depth: 0
      - name: Persist backfill
        run: |
          git add paper_trading/batman_ledger.csv paper_trading/batman_signals.csv site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add Batman first paper trade backfill"
          git push origin HEAD:research/monte-carlo-wfa-v1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Cleanup one-off workflow
        run: |
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/batman-first-trade-backfill.yml batman_backfill_status.txt
          git add .github/workflows/batman-first-trade-backfill.yml batman_backfill_status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-off Batman backfill workflow [backfill-cleanup]"
          git push origin main

