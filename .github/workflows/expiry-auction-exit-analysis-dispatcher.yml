name: Run Expiry-Day Exit Analysis — NIFTY + SENSEX

on:
  workflow_dispatch:
  # Programmatic fallback for environments where workflow_dispatch is not exposed.
  # The trigger file is deliberately narrow so normal report/doc commits do not retrigger this workflow.
  push:
    paths:
      - "ci/expiry_exit_analysis_trigger.txt"

concurrency:
  group: expiry-auction-exit-analysis-dispatcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: research/expiry-auction-exit-analysis-v1
          fetch-depth: 0

      - name: Record analysis start
        run: |
          echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > RUN_STARTED_UTC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUN_STARTED_UTC.txt
          git commit -m "ci: start expiry-day exit analysis [skip ci]"
          git push origin HEAD:research/expiry-auction-exit-analysis-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow huggingface_hub scipy
          python -m pip install -e .

      - name: Restore cached 1-minute index-options dataset
        uses: actions/cache@v4
        with:
          path: data/hf_index_options
          key: india-index-options-1m-expiry-exit-v2
          restore-keys: |
            india-index-options-1m-expiry-exit-

      - name: Download 1-minute dataset on cache miss
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/hf_index_options/index/NIFTY.parquet || ! -f data/hf_index_options/index/SENSEX.parquet ]]; then
            rm -rf data/hf_index_options
            python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="thetrademarkk/india-index-options-1m",
              repo_type="dataset",
              local_dir="data/hf_index_options",
              allow_patterns=[
                  "index/NIFTY.parquet",
                  "options/NIFTY/*.parquet",
                  "index/SENSEX.parquet",
                  "options/SENSEX/*.parquet",
              ],
          )
          PY
          fi
          test -f data/hf_index_options/index/NIFTY.parquet
          test -f data/hf_index_options/index/SENSEX.parquet
          test -d data/hf_index_options/options/NIFTY
          test -d data/hf_index_options/options/SENSEX

      - name: Build exact S5 composite SENSEX MC history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/external
          if [[ ! -s data/external/sensex_legacy_2018_2024.csv ]]; then
            curl -L --retry 5 --retry-delay 2 -A "Mozilla/5.0"               -o data/external/sensex_legacy_2018_2024.csv               https://raw.githubusercontent.com/sandeepkapri/Sensex-Minute-Data/master/sensex_candlestick_data.csv
          fi
          python - <<'PY'
          import pandas as pd
          legacy = pd.read_csv("data/external/sensex_legacy_2018_2024.csv")
          legacy["timestamp"] = pd.to_datetime(
              legacy["Date"].astype(str)+" "+legacy["Time"].astype(str),
              dayfirst=True, errors="coerce"
          )
          legacy["close"] = pd.to_numeric(legacy["Close"], errors="coerce")
          legacy = legacy.dropna(subset=["timestamp","close"]).sort_values("timestamp")
          legacy["trading_day"] = legacy["timestamp"].dt.normalize()
          legacy_daily = legacy.groupby("trading_day", as_index=False).tail(1)[["timestamp","trading_day","close"]]

          hf = pd.read_parquet("data/hf_index_options/index/SENSEX.parquet")
          hf["timestamp"] = pd.to_datetime(hf["timestamp"], errors="coerce")
          if getattr(hf["timestamp"].dt, "tz", None) is not None:
              hf["timestamp"] = hf["timestamp"].dt.tz_localize(None)
          hf["trading_day"] = pd.to_datetime(hf["trading_day"], errors="coerce").dt.normalize()
          hf["close"] = pd.to_numeric(hf["close"], errors="coerce")
          hf = hf.dropna(subset=["timestamp","trading_day","close"]).sort_values("timestamp")
          hf_daily = hf.groupby("trading_day", as_index=False).tail(1)[["timestamp","trading_day","close"]]

          daily = pd.concat([legacy_daily, hf_daily], ignore_index=True).sort_values(["trading_day","timestamp"])
          daily = daily.drop_duplicates("trading_day", keep="last").reset_index(drop=True)
          daily["open"] = daily["close"]; daily["high"] = daily["close"]; daily["low"] = daily["close"]
          daily.to_parquet("data/expiry_exit/sensex_mc_daily.parquet", index=False)
          print("SENSEX composite MC rows:", len(daily), "range:", daily["trading_day"].min(), daily["trading_day"].max())
          PY
          test -s data/expiry_exit/sensex_mc_daily.parquet

      - name: Compile
        run: python -m py_compile scripts/expiry_auction_exit_analysis_v2.py

      - name: Run frozen-entry / early-exit comparison
        run: |
          python scripts/expiry_auction_exit_analysis_v2.py             --data-root data/hf_index_options             --out-dir reports/expiry_exit             --paths 5000             --seed-base 20260920

      - name: Verify outputs
        run: |
          test -s reports/expiry_exit/RESULTS.md
          test -s reports/expiry_exit/TRADE_LEVEL_RESULTS.csv
          test -s reports/expiry_exit/EXIT_SUMMARY_BY_SPLIT.csv
          test -s reports/expiry_exit/COMBINED_OOS_SUMMARY.csv
          python - <<'PY'
          import pandas as pd
          p="reports/expiry_exit/COMBINED_OOS_SUMMARY.csv"
          df=pd.read_csv(p)
          required={("NIFTY","Batman","15:00"),("NIFTY","Batman","15:10"),
                    ("NIFTY","Adaptive","15:00"),("NIFTY","Adaptive","15:10"),
                    ("SENSEX","Batman","15:00"),("SENSEX","Batman","15:10"),
                    ("SENSEX","Adaptive","15:00"),("SENSEX","Adaptive","15:10")}
          got=set(map(tuple,df[["index","strategy","exit"]].itertuples(index=False,name=None)))
          missing=required-got
          if missing:
              raise SystemExit(f"missing required exit scenarios: {sorted(missing)}")
          print("Required NIFTY/SENSEX Batman/Adaptive 15:00/15:10 scenarios present.")
          PY
          echo "=== COMBINED OOS ==="
          cat reports/expiry_exit/COMBINED_OOS_SUMMARY.csv
          echo
          echo "=== SPLITS ==="
          head -50 reports/expiry_exit/EXIT_SUMMARY_BY_SPLIT.csv

      - name: Publish reports to analysis branch
        run: |
          set -euo pipefail
          rm -rf /tmp/expiry_exit_publish
          mkdir -p /tmp/expiry_exit_publish
          cp -a reports/expiry_exit /tmp/expiry_exit_publish/
          git fetch origin research/expiry-auction-exit-analysis-v1
          git reset --hard origin/research/expiry-auction-exit-analysis-v1
          rm -rf reports/expiry_exit
          cp -a /tmp/expiry_exit_publish/expiry_exit reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/expiry_exit
          git commit -m "research: publish expiry-day exit analysis [skip ci]" || true
          git push origin HEAD:research/expiry-auction-exit-analysis-v1

      - name: Finish phase status
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("docs/expiry_exit_analysis/PHASE_STATUS.md")
          text=p.read_text()
          text=text.replace("| E3 CI execution | IN PROGRESS |","| E3 CI execution | COMPLETE |")
          text=text.replace("| E4 Results verification | NOT STARTED |","| E4 Results verification | COMPLETE |")
          text=text.replace("| E5 Final comparison report | NOT STARTED |","| E5 Final comparison report | COMPLETE |")
          text=text.replace("No exit result is used to change entry rules.","No exit result is used to change entry rules. Results are published under reports/expiry_exit/.")
          p.write_text(text)
          e=Path("docs/expiry_exit_analysis/ERROR_LOG.md")
          et=e.read_text()
          et += "\n## 2026-09-20 — E003 CI rerun\nThe analysis was re-executed with cached/public 1-minute NIFTY/SENSEX options data so 15:00/15:10 exit bars were directly observable. The historical daily NIFTY source is pinned on the branch for reproducibility.\n"
          e.write_text(et)
          PY
          git add docs/expiry_exit_analysis
          git commit -m "docs: close expiry-day exit analysis phase [skip ci]" || true
          git push origin HEAD:research/expiry-auction-exit-analysis-v1

      - name: Summary
        run: |
          echo "Expiry-day exit analysis completed."
