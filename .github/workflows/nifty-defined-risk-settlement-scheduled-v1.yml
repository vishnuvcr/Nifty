name: NIFTY Defined-Risk Prospective Settlement
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
concurrency:
  group: nifty-defined-risk-settlement
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-defined-risk-nifty-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Settle NIFTY frozen candidates
        run: python scripts/nifty_defined_risk_prospective_v1.py --mode settle
      - name: Persist settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/prospective_defined_risk/nifty site/prospective-defined-risk/nifty
          if git diff --cached --quiet; then
            echo "No NIFTY settlement changes."
          else
            git commit -m "paper: settle NIFTY defined-risk prospective candidates [skip ci]"
            git push origin HEAD:research/prospective-defined-risk-nifty-v1
          fi
