name: SENSEX S6 Per-Lot Edge + Slippage + Seed Robustness

on:
  push:
    branches:
      - research/sensex-s6-robustness-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sensex-s6-robustness-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip pandas numpy pyarrow huggingface_hub tabulate

      - name: Restore cached warmup SENSEX history
        uses: actions/cache@v4
        with:
          path: data/external/sensex_legacy_2018_2024.csv
          key: sensex-warmup-2018-2024-v1

      - name: Restore cached SENSEX dataset
        uses: actions/cache@v4
        with:
          path: data/raw_sensex
          key: sensex-options-Linux-2026-09-v4
          restore-keys: |
            sensex-options-Linux-

      - name: Fetch warmup history only on cache miss
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s data/external/sensex_legacy_2018_2024.csv ]]; then
            mkdir -p data/external
            curl -L --retry 5 --retry-delay 2 -A "Mozilla/5.0" -o data/external/sensex_legacy_2018_2024.csv https://raw.githubusercontent.com/sandeepkapri/Sensex-Minute-Data/master/sensex_candlestick_data.csv
          fi
          test -s data/external/sensex_legacy_2018_2024.csv

      - name: Fetch dataset only on cache miss
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/raw_sensex/index/SENSEX.parquet ]]; then
            rm -rf data/raw_sensex
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m", repo_type="dataset", local_dir="data/raw_sensex", allow_patterns=["index/SENSEX.parquet", "options/SENSEX/*.parquet"])'
          fi
          test -f data/raw_sensex/index/SENSEX.parquet
          test -d data/raw_sensex/options/SENSEX

      - name: Build independent daily MC history
        run: |
          python - <<'PY'
          import pandas as pd
          legacy = pd.read_csv('data/external/sensex_legacy_2018_2024.csv')
          legacy['timestamp'] = pd.to_datetime(legacy['Date'].astype(str)+' '+legacy['Time'].astype(str), dayfirst=True, errors='coerce')
          legacy['close'] = pd.to_numeric(legacy['Close'], errors='coerce')
          legacy = legacy.dropna(subset=['timestamp','close']).sort_values('timestamp')
          legacy['trading_day'] = legacy['timestamp'].dt.normalize()
          legacy_daily = legacy.groupby('trading_day', as_index=False).tail(1)[['timestamp','trading_day','close']]
          hf = pd.read_parquet('data/raw_sensex/index/SENSEX.parquet')
          hf['timestamp'] = pd.to_datetime(hf['timestamp'], errors='coerce')
          if getattr(hf['timestamp'].dt, 'tz', None) is not None:
              hf['timestamp'] = hf['timestamp'].dt.tz_localize(None)
          hf['trading_day'] = pd.to_datetime(hf['trading_day'], errors='coerce').dt.normalize()
          hf['close'] = pd.to_numeric(hf['close'], errors='coerce')
          hf = hf.dropna(subset=['timestamp','trading_day','close']).sort_values('timestamp')
          hf_daily = hf.groupby('trading_day', as_index=False).tail(1)[['timestamp','trading_day','close']]
          daily = pd.concat([legacy_daily, hf_daily], ignore_index=True).sort_values(['trading_day','timestamp'])
          daily = daily.drop_duplicates('trading_day', keep='last').reset_index(drop=True)
          daily['open'] = daily['close']; daily['high'] = daily['close']; daily['low'] = daily['close']
          daily.to_parquet('data/external/sensex_mc_daily.parquet', index=False)
          print('MC daily rows:', len(daily), 'from', daily.trading_day.min(), 'to', daily.trading_day.max())
          PY

      - name: Run slippage sensitivity at frozen seed
        shell: bash
        run: |
          set -euo pipefail
          for slip in 0.25 0.50 1.00 2.00; do
            for split in development validation holdout; do
              out="reports/sensex_s6/slippage_${slip}"
              mkdir -p "${out}"
              python scripts/sensex_backtest_v1.py                 --options-dir data/raw_sensex/options/SENSEX                 --index-path data/raw_sensex/index/SENSEX.parquet                 --mc-index-path data/external/sensex_mc_daily.parquet                 --split "${split}"                 --slippage "${slip}"                 --seed-base 20260920                 --one-lot-edge                 --out-dir "${out}"
            done
          done

      - name: Run Monte Carlo seed sensitivity on OOS periods
        shell: bash
        run: |
          set -euo pipefail
          for seed in 101 202 303 404 505; do
            for split in validation holdout; do
              out="reports/sensex_s6/seed_${seed}"
              mkdir -p "${out}"
              python scripts/sensex_backtest_v1.py                 --options-dir data/raw_sensex/options/SENSEX                 --index-path data/raw_sensex/index/SENSEX.parquet                 --mc-index-path data/external/sensex_mc_daily.parquet                 --split "${split}"                 --slippage 0.50                 --seed-base "${seed}"                 --one-lot-edge                 --out-dir "${out}"
            done
          done

      - name: Verify S5 reproducibility at base scenario
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ref=json.loads(Path('docs/sensex_options/S5_BASELINE_REFERENCE.json').read_text())
          for split in ('development','validation','holdout'):
              got=json.loads(Path(f'reports/sensex_s6/slippage_0.50/summary_{split}.json').read_text())
              exp=ref[split]
              checks = {
                  'adaptive_trades': got['adaptive']['trades'] == exp['adaptive_trades'],
                  'adaptive_total_pnl': abs(got['adaptive']['total_pnl'] - exp['adaptive_total_pnl']) < 1e-6,
                  'batman_trades': got['batman']['trades'] == exp['batman_trades'],
                  'batman_total_pnl': abs(got['batman']['total_pnl'] - exp['batman_total_pnl']) < 1e-6,
              }
              if not all(checks.values()):
                  raise SystemExit(f'S5 reproducibility mismatch {split}: {checks}')
          print('S5 baseline reproduction gate: PASS')
          PY

      - name: Build statistical robustness summary
        run: python scripts/sensex_s6_robustness.py --reports-dir reports/sensex_s6 --out-dir reports/sensex_s6

      - name: Publish results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/sensex_s6_publish
          mkdir -p /tmp/sensex_s6_publish
          cp -a reports/sensex_s6 /tmp/sensex_s6_publish/
          git fetch origin research/sensex-s6-robustness-v1
          git reset --hard origin/research/sensex-s6-robustness-v1
          rm -rf reports/sensex_s6
          cp -a /tmp/sensex_s6_publish/sensex_s6 reports/
          git add reports/sensex_s6
          git commit -m "research: publish SENSEX S6 robustness results [skip ci]" || true
          git push origin HEAD:research/sensex-s6-robustness-v1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensex-s6-robustness
          path: reports/sensex_s6
