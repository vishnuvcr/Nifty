name: SENSEX S6 Per-Lot Edge + Slippage + Seed Robustness

on:
  push:
    branches:
      - research/sensex-s6-robustness-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sensex-s6-robustness-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip pandas numpy pyarrow huggingface_hub tabulate

      - name: Restore cached SENSEX dataset
        uses: actions/cache@v4
        with:
          path: data/raw_sensex
          key: sensex-options-v1-${{ runner.os }}-${{ hashFiles('docs/sensex_options/DATA_MANIFEST.md') }}
          restore-keys: |
            sensex-options-v1-${{ runner.os }}-

      - name: Fetch dataset only on cache miss
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/raw_sensex/index/SENSEX.parquet ]]; then
            rm -rf data/raw_sensex
            python - <<'PY'
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="thetrademarkk/india-index-options-1m",
                repo_type="dataset",
                local_dir="data/raw_sensex",
                allow_patterns=["index/SENSEX.parquet", "options/SENSEX/*.parquet"],
            )
            PY
          fi
          test -f data/raw_sensex/index/SENSEX.parquet
          test -d data/raw_sensex/options/SENSEX

      - name: Run slippage sensitivity at frozen seed
        shell: bash
        run: |
          set -euo pipefail
          for slip in 0.25 0.50 1.00 2.00; do
            for split in development validation holdout; do
              out="reports/sensex_s6/slippage_${slip}"
              mkdir -p "${out}"
              python scripts/sensex_backtest_v1.py                 --options-dir data/raw_sensex/options/SENSEX                 --index-path data/raw_sensex/index/SENSEX.parquet                 --split "${split}"                 --slippage "${slip}"                 --seed-base 20260920                 --one-lot-edge                 --out-dir "${out}"
            done
          done

      - name: Run Monte Carlo seed sensitivity on OOS periods
        shell: bash
        run: |
          set -euo pipefail
          for seed in 101 202 303 404 505; do
            for split in validation holdout; do
              out="reports/sensex_s6/seed_${seed}"
              mkdir -p "${out}"
              python scripts/sensex_backtest_v1.py                 --options-dir data/raw_sensex/options/SENSEX                 --index-path data/raw_sensex/index/SENSEX.parquet                 --split "${split}"                 --slippage 0.50                 --seed-base "${seed}"                 --one-lot-edge                 --out-dir "${out}"
            done
          done

      - name: Build statistical robustness summary
        run: python scripts/sensex_s6_robustness.py --reports-dir reports/sensex_s6 --out-dir reports/sensex_s6

      - name: Publish results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sensex_s6
          git commit -m "research: publish SENSEX S6 robustness results [skip ci]" || true
          git fetch origin research/sensex-s6-robustness-v1
          git rebase origin/research/sensex-s6-robustness-v1
          git push origin HEAD:research/sensex-s6-robustness-v1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensex-s6-robustness
          path: reports/sensex_s6
