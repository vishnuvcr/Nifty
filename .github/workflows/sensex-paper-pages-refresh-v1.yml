name: Refresh SENSEX Paper Trading Pages

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: sensex-paper-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SENSEX S7 branch
        uses: actions/checkout@v4
        with:
          ref: research/sensex-s7-paper-trading-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests

      - name: Settle matured paper trades and rebuild SENSEX pages
        shell: bash
        run: |
          set +e
          python scripts/refresh_sensex_paper_pages_v1.py
          status=$?
          if [ "$status" -ne 0 ]; then
            printf '\n### S7 page-refresh runtime event — %s\nType: prospective page refresh\nObservation: refresh workflow failed with exit code %s.\nResolution: no broker order was attempted; previous page state remains published.\nPrevention: page refresh remains separate from signal generation.\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$status" >> docs/sensex_options/ERROR_LOG.md
          fi
          exit "$status"

      - name: Publish refreshed pages and ledger state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin research/sensex-s7-paper-trading-v1
          git pull --rebase --autostash origin research/sensex-s7-paper-trading-v1
          git add paper_trading/sensex_batman_ledger.csv \
                  paper_trading/sensex_adaptive_ledger.csv \
                  site/sensex \
                  docs/sensex_options/ERROR_LOG.md
          if git diff --cached --quiet; then
            echo "No SENSEX page-refresh state changes."
          else
            git commit -m "chore: refresh SENSEX paper trading pages [skip ci]"
            git push origin HEAD:research/sensex-s7-paper-trading-v1
          fi

      - name: Trigger combined GitHub Pages publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-paper-pages.yml --repo "${{ github.repository }}" --ref main

      - name: Summary
        run: |
          {
            echo "## SENSEX paper-trading page refresh"
            echo
            echo "- Schedule: weekdays at 16:00 IST (10:30 UTC)"
            echo "- Actions: settle matured paper trades, rebuild Batman/Adaptive pages, publish current state"
            echo "- No new entry signal is generated by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
