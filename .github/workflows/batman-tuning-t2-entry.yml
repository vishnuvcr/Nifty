name: BATMAN Tuning T2 Entry Reconciled

on:
  push:
    branches:
      - research/batman-tuning-t2-entry-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batman-tuning-t2-entry
  cancel-in-progress: true

jobs:
  t2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore T2 prepared cache
        id: cache_v1
        uses: actions/cache/restore@v4
        with:
          path: .cache/batman_t2
          key: batman-tuning-t2-raw-v1-2026-09-21

      - name: Restore parent T1 raw cache fallback
        if: steps.cache_v1.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/batman_raw
          key: batman-tuning-raw-v3-2026-09-21

      - name: Prepare source directories
        run: |
          mkdir -p .cache/batman_t2 .cache/batman_raw
          if [ -f .cache/batman_raw/ayush_nifty_banknifty_options_2020_2024.zip ]; then cp .cache/batman_raw/ayush_nifty_banknifty_options_2020_2024.zip .cache/batman_t2/; fi
          if [ -f .cache/batman_raw/nifty_index_2008_2020.zip ]; then cp .cache/batman_raw/nifty_index_2008_2020.zip .cache/batman_t2/; fi
          if [ -f .cache/batman_raw/t2_ayush_expiry_calendar.csv ]; then cp .cache/batman_raw/t2_ayush_expiry_calendar.csv .cache/batman_t2/; fi
          if [ -f .cache/batman_raw/t2_ayush_daily_file_map.csv ]; then cp .cache/batman_raw/t2_ayush_daily_file_map.csv .cache/batman_t2/; fi
          if [ -f .cache/batman_raw/t2_nifty_daily.csv ]; then cp .cache/batman_raw/t2_nifty_daily.csv .cache/batman_t2/; fi
          if [ -f .cache/batman_raw/t2_nifty_spot_0930.csv ]; then cp .cache/batman_raw/t2_nifty_spot_0930.csv .cache/batman_t2/; fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest

      - name: Acquire Ayush options archive when cache is unavailable
        run: |
          set -euo pipefail
          test -f .cache/batman_t2/ayush_nifty_banknifty_options_2020_2024.zip || curl -fL --retry 3 --retry-all-errors "https://www.kaggle.com/api/v1/datasets/download/ayushsacri/indian-nifty-and-banknifty-options-data-2020-2024" -o .cache/batman_t2/ayush_nifty_banknifty_options_2020_2024.zip

      - name: Acquire long NIFTY archive when cache is unavailable
        run: |
          set -euo pipefail
          test -f .cache/batman_t2/nifty_index_2008_2020.zip || curl -fL --retry 3 --retry-all-errors "https://www.kaggle.com/api/v1/datasets/download/nishanthsalian/indian-stock-index-1minute-data-2008-2020" -o .cache/batman_t2/nifty_index_2008_2020.zip

      - name: Run T2 unit tests
        run: python -m pytest -q tests/test_batman_t2_entry.py

      - name: Reconstruct parent-style EOD control
        run: |
          python scripts/batman_t2_parent_eod_reconcile.py             --options-zip .cache/batman_t2/ayush_nifty_banknifty_options_2020_2024.zip             --long-index-zip .cache/batman_t2/nifty_index_2008_2020.zip             --raw-cache .cache/batman_t2             --out-dir reports/batman_t2             --paths 5000             --seed-base 20260921

      - name: Run full T2 D0-D6 entry study
        run: |
          python scripts/batman_t2_entry.py             --options-zip .cache/batman_t2/ayush_nifty_banknifty_options_2020_2024.zip             --long-index-zip .cache/batman_t2/nifty_index_2008_2020.zip             --raw-cache .cache/batman_t2             --out-dir reports/batman_t2             --paths 5000             --seed-base 20260921

      - name: Save T2 prepared cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/batman_t2
          key: batman-tuning-t2-raw-v1-2026-09-21

      - name: Upload T2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batman-tuning-t2-entry-v2-results
          path: |
            reports/batman_t2/T2_ENTRY_TRADE_LEVEL.csv
            reports/batman_t2/T2_ENTRY_SUMMARY.csv
            reports/batman_t2/T2_ENTRY_PAIRED_CONTROL.csv
            reports/batman_t2/T2_OPPORTUNITY_MATRIX.csv
            reports/batman_t2/T2_SKIP_COUNTS.json
            reports/batman_t2/BATMAN_PARENT_EOD_CONTROL.csv
            reports/batman_t2/BATMAN_PARENT_EOD_CONTROL_SUMMARY.json
            reports/batman_t2/BATMAN_PARENT_EOD_SKIP_COUNTS.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: echo "T2 D0-D6 entry study completed or failed; see uploaded artifacts and phase log." >> "$GITHUB_STEP_SUMMARY"
