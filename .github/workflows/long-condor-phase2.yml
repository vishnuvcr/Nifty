name: long-condor-phase2-analysis

on:
  push:
    branches: ["research/monte-carlo-wfa-v1"]
    paths:
      - scripts/analyze_long_condor_phase2.py
      - .github/workflows/long-condor-phase2.yml
  workflow_dispatch:
    inputs:
      wfa_run_id:
        description: "Long-condor WFA run ID (optional; defaults to latest successful run)"
        required: false
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve WFA run
        id: wfa
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.wfa_run_id }}
        run: |
          if [ -n "$INPUT_RUN_ID" ]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "long-condor-walk-forward" --branch research/monte-carlo-wfa-v1 --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using WFA run: $run_id"
      - name: Download WFA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download "${{ steps.wfa.outputs.run_id }}" --repo "${{ github.repository }}" --name long-condor-wfa-results --dir input
          find input -type f -maxdepth 2 -print
      - name: Run leakage-safe Phase 2 analysis
        run: |
          python scripts/analyze_long_condor_phase2.py             --input input/long_condor_wfa.csv             --out-dir results             --dev-end-year 2022             --validation-start-year 2023             --validation-end-year 2024             --final-start-year 2025             --bootstrap 2000
      - uses: actions/upload-artifact@v4
        with:
          name: long-condor-phase2-results
          path: results/
          retention-days: 30
