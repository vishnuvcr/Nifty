name: nested-regime-strategy-discovery-v1

on:
  push:
    branches: ["research/monte-carlo-wfa-v1"]
    paths:
      - scripts/run_nested_regime_strategy_discovery_v1.py
      - tests/test_nested_regime_strategy_discovery_v1.py
      - src/nifty_mc/strategy_catalog.py
      - .github/workflows/nested-regime-strategy-discovery-v1.yml
  workflow_dispatch:

env:
  V2_RUN_ID: "35425922439"

jobs:
  nested-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Download pinned V2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download "$V2_RUN_ID" --repo "${{ github.repository }}" --name strategy-regime-lab-v2-results --dir input
          test -f input/strategy_trades.csv
      - name: Tests
        run: pytest -q tests/test_nested_regime_strategy_discovery_v1.py
      - name: Nested discovery
        run: |
          rm -rf nested_results
          python scripts/run_nested_regime_strategy_discovery_v1.py \
            --trades input/strategy_trades.csv \
            --out-dir nested_results \
            --lookbacks 63 126 252 \
            --quantile-pairs 0.25,0.75 0.3333333333,0.6666666667 0.20,0.80 \
            --outer-years 2023 2024 2025 \
            --holdout-year 2026 \
            --operating-cost 2
      - name: Publish result
        run: cat nested_results/nested_regime_strategy_discovery_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: nested-regime-strategy-discovery-v1
          path: nested_results/
          retention-days: 30
