name: Batman First Trade Backfill V2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/batman-first-trade-backfill-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/monte-carlo-wfa-v1
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run first trade backfill
        id: backfill
        continue-on-error: true
        run: |
          set +e
          python scripts/backfill_batman_first_trade.py > /tmp/backfill.log 2>&1
          rc=$?
          cat /tmp/backfill.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic
        if: always()
        run: |
          {
            echo "run_id=${{ github.run_id }}"
            echo "backfill_rc=${{ steps.backfill.outputs.rc }}"
            echo "----- LOG -----"
            cat /tmp/backfill.log 2>/dev/null || true
          } > batman_backfill_status_v2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          cp batman_backfill_status_v2.txt /tmp/batman_backfill_status_v2.txt
          cp /tmp/batman_backfill_status_v2.txt batman_backfill_status_v2.txt
          git add batman_backfill_status_v2.txt
          git commit -m "chore: publish Batman backfill v2 diagnostic" || true
          git push origin main
      - name: Stop if backfill failed
        if: steps.backfill.outputs.rc != '0'
        run: exit 1
      - name: Checkout research branch again
        uses: actions/checkout@v4
        with:
          ref: research/monte-carlo-wfa-v1
          fetch-depth: 0
      - name: Show generated records
        run: |
          echo "=== SIGNAL ==="
          tail -n 3 paper_trading/batman_signals.csv
          echo "=== LEDGER ==="
          tail -n 3 paper_trading/batman_ledger.csv
      - name: Persist research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/batman_signals.csv paper_trading/batman_ledger.csv site
          git commit -m "feat: add Batman first paper trade backfill"
          git push origin HEAD:research/monte-carlo-wfa-v1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Summary
        run: |
          echo "## Batman first paper trade" >> "$GITHUB_STEP_SUMMARY"
          echo "- Entry: 2026-09-17" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model cutoff: 2026-09-16" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expiry: 2026-09-22" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages: https://vishnuvcr.github.io/Nifty/" >> "$GITHUB_STEP_SUMMARY"
