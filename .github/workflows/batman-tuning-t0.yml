name: BATMAN Tuning T0 Protocol
on:
  workflow_dispatch:
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/batman_tuning_t0_check.py
      - run: python -m pip install pytest
      - run: pytest -q tests/test_batman_tuning_protocol.py
