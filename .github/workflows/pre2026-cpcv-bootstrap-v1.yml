name: pre2026-cpcv-bootstrap-v1

on:
  push:
    branches: ["research/nested-cpcv-bootstrap-v1"]
    paths:
      - scripts/run_pre2026_cpcv_bootstrap_v1.py
      - tests/test_pre2026_cpcv_bootstrap_v1.py
      - src/nifty_mc/strategy_catalog.py
      - .github/workflows/pre2026-cpcv-bootstrap-v1.yml
  workflow_dispatch:

env:
  V2_RUN_ID: "35425922439"

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Download pinned V2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download "$V2_RUN_ID" --repo "${{ github.repository }}" --name strategy-regime-lab-v2-results --dir input
          test -f input/strategy_trades.csv
      - name: Tests
        run: pytest -q tests/test_pre2026_cpcv_bootstrap_v1.py
      - name: CPCV bootstrap
        run: |
          rm -rf robustness_results
          python scripts/run_pre2026_cpcv_bootstrap_v1.py \
            --trades input/strategy_trades.csv \
            --out-dir robustness_results \
            --lookback 63 --qlo 0.20 --qhi 0.80 \
            --cost 2 --groups 6 --test-groups 2 --block 5 --bootstrap 10000
      - name: Publish result
        run: cat robustness_results/pre2026_cpcv_bootstrap_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: pre2026-cpcv-bootstrap-v1
          path: robustness_results/
          retention-days: 30
