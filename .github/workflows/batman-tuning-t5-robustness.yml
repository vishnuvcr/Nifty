name: BATMAN Tuning T5 Robustness

on:
  push:
    branches:
      - research/batman-tuning-t5-robustness-v1
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download accepted frozen holdout artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/holdout
          gh run download 35605509219 --repo "${{ github.repository }}" --name batman-tuning-t4-frozen-holdout --dir reports/holdout

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy

      - name: Run robustness analysis
        run: |
          python scripts/batman_t5_robustness.py --trade-level reports/holdout/T4_HOLDOUT_TRADE_LEVEL.csv --out-dir reports/batman_t5

      - name: Run paired holdout expiry-control benchmark
        run: |
          mkdir -p .cache/batman_t4_holdout
          if [ ! -s .cache/batman_t4_holdout/rahul_nifty_options_2025_2026.zip ]; then
            curl -fL --retry 3 --retry-all-errors               "https://www.kaggle.com/api/v1/datasets/download/rahultr1/nifty-options-weekly-1min-2025-01-01-to-2026-07-25"               -o .cache/batman_t4_holdout/rahul_nifty_options_2025_2026.zip
          fi
          python scripts/batman_t5_holdout_control.py             --options-zip .cache/batman_t4_holdout/rahul_nifty_options_2025_2026.zip             --trade-level reports/holdout/T4_HOLDOUT_TRADE_LEVEL.csv             --out-dir reports/batman_t5

      - name: Upload robustness results
        uses: actions/upload-artifact@v4
        with:
          name: batman-tuning-t5-robustness
          path: |
            reports/batman_t5/T5_ROBUSTNESS_SUMMARY.json
            reports/batman_t5/T5_SLIPPAGE_STRESS.csv
            reports/batman_t5/T5_YEARLY_STABILITY.csv
            reports/batman_t5/T5_LEAVE_ONE_OUT.csv
            reports/batman_t5/T5_HOLDOUT_PAIRED_CONTROL.csv
            reports/batman_t5/T5_HOLDOUT_PAIRED_CONTROL_SUMMARY.csv
          retention-days: 30
