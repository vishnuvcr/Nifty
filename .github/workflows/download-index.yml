name: download-nifty-index

on:
  push:
    branches: ["research/monte-carlo-wfa-v1"]
    paths:
      - ".github/workflows/download-index.yml"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2015-01-01"
      end:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-09-18"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas

      - name: Download public NIFTY history
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Hareeshkesavan/Stock-Market-Dataset/main/Nifty%2050%20Historical%20Data.csv" -o data/raw/nifty50_source.csv
          python -c "import pandas as pd; p='data/raw/nifty50_source.csv'; d=pd.read_csv(p); d.columns=[str(c).strip().lower() for c in d.columns]; d['date']=pd.to_datetime(d['date'],errors='coerce'); d['close']=pd.to_numeric(d['price'].astype(str).str.replace(',','',regex=False),errors='coerce'); d=d[['date','close']].dropna().drop_duplicates('date').sort_values('date'); d.to_csv('data/raw/nifty50_index.csv',index=False); print('rows',len(d),'range',d.date.min(),d.date.max())"

      - name: Validate
        run: |
          python -c "import pandas as pd; d=pd.read_csv('data/raw/nifty50_index.csv',parse_dates=['date']); assert len(d)>1000; assert d.date.is_unique; assert d.date.is_monotonic_increasing; assert (d.close>0).all(); print(d.head(3)); print(d.tail(3)); print('VALIDATED',len(d),'sessions')"

      - name: Record provenance
        run: |
          printf '%s\n' 'source,source_url,status' 'Hareeshkesavan/Stock-Market-Dataset,https://github.com/Hareeshkesavan/Stock-Market-Dataset,secondary_public_mirror' > data/raw/nifty50_index_provenance.csv

      - uses: actions/upload-artifact@v4
        with:
          name: nifty50-index-research
          path: data/raw/
          retention-days: 14
