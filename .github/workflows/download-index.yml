name: download-nifty-index

on:
  push:
    branches: ["research/monte-carlo-wfa-v1"]
    paths:
      - ".github/workflows/download-index.yml"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2015-01-01"
      end:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-09-18"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve date range
        id: dates
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ inputs.end }}" >> "$GITHUB_OUTPUT"
          else
            echo "start=2015-01-01" >> "$GITHUB_OUTPUT"
            echo "end=2026-09-18" >> "$GITHUB_OUTPUT"
          fi

      - name: Download NIFTY 50 index history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          python scripts/download_nse_data.py \
            --start "${{ steps.dates.outputs.start }}" \
            --end "${{ steps.dates.outputs.end }}" \
            --out-dir data/raw \
            --index-only || true

          if [ ! -s data/raw/nifty50_index.csv ]; then
            echo "NSE endpoint unavailable from GitHub runner; using a documented public research mirror."
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/Hareeshkesavan/Stock-Market-Dataset/main/Nifty%2050%20Historical%20Data.csv" \
              -o data/raw/nifty50_index_mirror.csv

            python - <<'PY'
            import pandas as pd
            src = "data/raw/nifty50_index_mirror.csv"
            out = "data/raw/nifty50_index.csv"
            df = pd.read_csv(src)
            df.columns = [str(c).strip().lower() for c in df.columns]
            df["date"] = pd.to_datetime(df["date"], errors="coerce")
            df["close"] = (
                df["price"].astype(str).str.replace(",", "", regex=False)
                .pipe(pd.to_numeric, errors="coerce")
            )
            df = df[["date", "close"]].dropna().drop_duplicates("date")
            df = df.sort_values("date")
            lo = pd.Timestamp("${{ steps.dates.outputs.start }}")
            hi = pd.Timestamp("${{ steps.dates.outputs.end }}")
            df = df[(df["date"] >= lo) & (df["date"] <= hi)]
            df.to_csv(out, index=False)
            pd.DataFrame([{
                "source": "Hareeshkesavan/Stock-Market-Dataset",
                "file": "Nifty 50 Historical Data.csv",
                "source_url": "https://github.com/Hareeshkesavan/Stock-Market-Dataset",
                "status": "secondary_public_mirror"
            }]).to_csv("data/raw/nifty50_index_provenance.csv", index=False)
            PY
          fi

      - name: Validate downloaded data
        run: |
          python - <<'PY'
          import pandas as pd
          p = "data/raw/nifty50_index.csv"
          df = pd.read_csv(p, parse_dates=["date"])
          assert len(df) > 1000, f"Unexpectedly small dataset: {len(df)} rows"
          assert df["date"].is_monotonic_increasing
          assert df["date"].is_unique
          assert (df["close"] > 0).all()
          print(df.head(3).to_string(index=False))
          print(df.tail(3).to_string(index=False))
          print(f"validated {len(df)} sessions")
          PY

      - name: Upload research dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty50-index-${{ steps.dates.outputs.start }}-${{ steps.dates.outputs.end }}
          path: data/raw/
          retention-days: 14
