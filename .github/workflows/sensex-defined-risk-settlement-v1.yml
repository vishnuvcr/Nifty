name: SENSEX Defined-Risk Prospective Settlement
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
  push:
    branches: ["research/prospective-defined-risk-sensex-v1"]
    paths:
      - "scripts/sensex_defined_risk_prospective_v1.py"
      - ".github/workflows/sensex-defined-risk-settlement-v1.yml"
concurrency:
  group: sensex-defined-risk-settlement
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/prospective-defined-risk-sensex-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Settle matured candidate ledgers
        run: python scripts/sensex_defined_risk_prospective_v1.py --mode settle
      - name: Persist settled state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/prospective_defined_risk/sensex site/sensex/prospective-defined-risk
          if git diff --cached --quiet; then echo "No settlement changes."; else git commit -m "paper: settle SENSEX defined-risk prospective candidates [skip ci]"; git push origin HEAD:research/prospective-defined-risk-sensex-v1; fi
