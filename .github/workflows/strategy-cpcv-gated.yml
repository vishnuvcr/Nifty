name: strategy-cpcv-gated

on:
  workflow_run:
    workflows: ["strategy-regime-lab-v2"]
    types: [completed]
  push:
    branches: ["research/monte-carlo-wfa-v1"]
    paths:
      - scripts/run_strategy_cpcv.py
      - .github/workflows/strategy-cpcv-gated.yml
  workflow_dispatch:

jobs:
  cpcv:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Resolve V2 run
        id: v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "strategy-regime-lab-v2" --branch research/monte-carlo-wfa-v1 --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download V2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download "${{ steps.v2.outputs.run_id }}" --repo "${{ github.repository }}" --name strategy-regime-lab-v2-results --dir input
          test -f input/strategy_trades.csv
      - name: Run all-strategy gated CPCV
        run: |
          mkdir -p results
          python scripts/run_strategy_cpcv.py \
            --trades input/strategy_trades.csv \
            --out-dir results \
            --cost-per-contract 2 \
            --dev-end-year 2024 \
            --final-start-year 2025 \
            --n-groups 6 \
            --test-groups 2 \
            --min-train-trades 10 \
            --bootstrap 10000
      - name: Publish headline
        run: |
          cat results/strategy_cpcv_report.md
          echo
          cat results/cpcv_selection_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-cpcv-gated
          path: results/
          retention-days: 30
