name: BATMAN Tuning T1 Data Baseline
on:
  workflow_dispatch:
jobs:
  t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate immutable historical cache
        run: python scripts/batman_tuning_t1_data_check.py
      - name: Run protocol tests
        run: python -m pytest -q tests/test_batman_tuning_protocol.py
