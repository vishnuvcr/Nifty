name: SENSEX Batman + Adaptive Walk-Forward Backtest

on:
  push:
    branches:
      - research/sensex-s5-wfa-backtest-v1
  workflow_dispatch:
    inputs:
      slippage:
        description: "Adverse slippage points per executed option leg"
        required: true
        default: "0.5"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sensex-s5-wfa-backtest-v1
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow

      - name: Fetch public SENSEX 1-minute research dataset
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://huggingface.co/datasets/thetrademarkk/india-index-options-1m.git data/raw_sensex
          cd data/raw_sensex
          git sparse-checkout set index/SENSEX.parquet options/SENSEX
          git lfs pull --include="index/SENSEX.parquet,options/SENSEX/*.parquet"

      - name: Run development backtest
        run: python scripts/sensex_backtest_v1.py --options-dir data/raw_sensex/options/SENSEX --index-path data/raw_sensex/index/SENSEX.parquet --split development --slippage "${{ inputs.slippage || '0.5' }}" --out-dir reports/sensex_options

      - name: Run validation backtest
        run: python scripts/sensex_backtest_v1.py --options-dir data/raw_sensex/options/SENSEX --index-path data/raw_sensex/index/SENSEX.parquet --split validation --slippage "${{ inputs.slippage || '0.5' }}" --out-dir reports/sensex_options

      - name: Run final holdout backtest
        run: python scripts/sensex_backtest_v1.py --options-dir data/raw_sensex/options/SENSEX --index-path data/raw_sensex/index/SENSEX.parquet --split holdout --slippage "${{ inputs.slippage || '0.5' }}" --out-dir reports/sensex_options

      - name: Save reproducible metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('reports/sensex_options/RUN_METADATA.txt')
          p.write_text('\n'.join([
            'dataset=thetrademarkk/india-index-options-1m',
            'license=cc-by-nc-4.0',
            'entry=09:30 IST, 3 trading sessions before actual expiry',
            'mc=5000 bootstrap paths, 756 daily returns',
            'base_slippage_points_per_leg=${{ inputs.slippage || '0.5' }}',
            'timestamp_utc='+datetime.now(timezone.utc).isoformat(),
          ])+'\n')
          PY

      - name: Commit backtest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sensex_options
          git commit -m "research: publish SENSEX Batman Adaptive backtest results [skip ci]" || true
          git push origin HEAD:research/sensex-s5-wfa-backtest-v1

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensex-backtest-results
          path: reports/sensex_options