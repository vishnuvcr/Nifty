name: Generate NIFTY Paper Trading Signals

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "scheduled"
        type: choice
        options: [scheduled, backfill_0940]
      decision_date:
        description: "Decision date YYYY-MM-DD for backfill"
        required: false
        default: ""
      entry_time_ist:
        description: "Entry time for backfill"
        required: false
        default: "09:30"
      capital:
        description: "Paper capital in INR"
        required: true
        default: "100000"
      risk_pct:
        description: "Risk budget fraction per trade"
        required: true
        default: "0.02"
      lot_size:
        description: "NIFTY lot size"
        required: true
        default: "65"
      paths:
        description: "Monte Carlo paths"
        required: true
        default: "5000"
      cost_per_contract:
        description: "Stress cost per option contract, in points"
        required: true
        default: "2.0"
      expiry:
        description: "Optional explicit expiry YYYY-MM-DD"
        required: false
        default: ""
      seed:
        description: "Optional fixed Monte Carlo seed; blank = deterministic per decision date"
        required: false
        default: ""

concurrency:
  group: nifty-paper-signal-generation
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPITAL: ${{ github.event.inputs.capital || '100000' }}
      RISK_PCT: ${{ github.event.inputs.risk_pct || '0.02' }}
      LOT_SIZE: ${{ github.event.inputs.lot_size || '65' }}
      PATHS: ${{ github.event.inputs.paths || '5000' }}
      COST_PER_CONTRACT: ${{ github.event.inputs.cost_per_contract || '2.0' }}
      EXPIRY: ${{ github.event.inputs.expiry || '' }}
      SEED: ${{ github.event.inputs.seed || '' }}
      MODE: ${{ github.event.inputs.mode || 'scheduled' }}
      DECISION_DATE: ${{ github.event.inputs.decision_date || '' }}
      ENTRY_TIME_IST: ${{ github.event.inputs.entry_time_ist || '09:30' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout adaptive research branch
        uses: actions/checkout@v4
        with:
          ref: research/adaptive-paper-signals-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Generate Batman signal
        if: env.MODE != 'backfill_0940'
        run: |
          CMD=(python scripts/batman_signal_producer.py
            --capital "$CAPITAL"
            --risk-pct "$RISK_PCT"
            --lot-size "$LOT_SIZE"
            --paths "$PATHS"
            --cost-per-contract "$COST_PER_CONTRACT"
            --site-dir site/batman)
          if [ -n "$DECISION_DATE" ]; then CMD+=(--decision-date "$DECISION_DATE"); else CMD+=(--decision-date auto); fi
          if [ -n "$EXPIRY" ]; then CMD+=(--expiry "$EXPIRY"); fi
          if [ -n "$SEED" ]; then CMD+=(--seed "$SEED"); fi
          "${CMD[@]}"

      - name: Generate Adaptive signal
        if: env.MODE != 'backfill_0940'
        run: |
          CMD=(python scripts/adaptive_paper_signal_producer_v1.py
            --capital "$CAPITAL"
            --risk-pct "$RISK_PCT"
            --lot-size "$LOT_SIZE"
            --paths "$PATHS"
            --cost-per-contract "$COST_PER_CONTRACT"
            --site-dir site/adaptive)
          if [ -n "$DECISION_DATE" ]; then CMD+=(--decision-date "$DECISION_DATE"); else CMD+=(--decision-date auto); fi
          if [ -n "$EXPIRY" ]; then CMD+=(--expiry "$EXPIRY"); fi
          if [ -n "$SEED" ]; then CMD+=(--seed "$SEED"); fi
          "${CMD[@]}"

      - name: Record controlled 09:40 backfill observations
        if: env.MODE == 'backfill_0940'
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/backfill_0940_no_trade.py > /tmp/backfill_0940_no_trade.py
          python /tmp/backfill_0940_no_trade.py --strategy "NIFTY BATMAN" --decision-date "$DECISION_DATE" --entry-time-ist "$ENTRY_TIME_IST" --output-json site/batman/data/backfill_0940_2026-09-21.json
          python /tmp/backfill_0940_no_trade.py --strategy "NIFTY ADAPTIVE" --decision-date "$DECISION_DATE" --entry-time-ist "$ENTRY_TIME_IST" --output-json site/adaptive/data/backfill_0940_2026-09-21.json

      - name: Persist signal state and run audit
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          FINISHED_IST="$(TZ=Asia/Kolkata date --iso-8601=seconds)"
          mkdir -p site/data
          cat > site/data/run_status_nifty_signal_generation.json <<EOF
          {
            "workflow": "Generate NIFTY Paper Trading Signals",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "trigger": "${{ github.event_name }}",
            "mode": "$MODE",
            "decision_date": "$DECISION_DATE",
            "entry_time_ist": "$ENTRY_TIME_IST",
            "scheduled_time_ist": "09:30 IST",
            "finished_at_ist": "${FINISHED_IST}",
            "status": "${JOB_STATUS}",
            "scope": ["NIFTY BATMAN", "NIFTY ADAPTIVE"],
            "note": "Signal producer audit record. Pages deployment is centralized."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin research/adaptive-paper-signals-v1
          git pull --rebase --autostash origin research/adaptive-paper-signals-v1
          git add paper_trading/batman_ledger.csv \
                  paper_trading/batman_signals.csv \
                  paper_trading/adaptive_ledger.csv \
                  paper_trading/adaptive_signals.csv \
                  paper_trading/adaptive_candidate_screen.csv \
                  paper_trading/adaptive_feature_history.csv \
                  site/data/run_status_nifty_signal_generation.json \
                  site/batman site/adaptive \
                  site/batman/data/backfill_0940_2026-09-21.json \
                  site/adaptive/data/backfill_0940_2026-09-21.json
          if git diff --cached --quiet; then
            echo "No signal-state changes."
          else
            git commit -m "chore: persist NIFTY signal state and run audit [skip ci]"
            git push origin HEAD:research/adaptive-paper-signals-v1
          fi

      - name: Publish summary
        run: |
          {
            echo "## NIFTY signal generation"
            echo
            echo "- Signal generation: weekdays at 09:30 IST"
            echo "- Branch: research/adaptive-paper-signals-v1"
            echo "- Pages: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "- Batman: /batman/"
            echo "- Adaptive: /adaptive/"
            echo
            echo "This workflow generates new entry signals. The 16:00 IST workflow is refresh-only and never creates a second entry signal."
          } >> "$GITHUB_STEP_SUMMARY"
